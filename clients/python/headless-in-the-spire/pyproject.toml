[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "headless-in-the-spire"
description = "Python client for the headless-in-the-spire runner (Slay the Spire 2)."
readme = "README.md"
# Pinned to 3.13 in lockstep with the workspace root (../../.python-version).
# Bump in both places.
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Julian Schubert" }]
dynamic = ["version"]
dependencies = [
    "pydantic>=2.6",
    # Shared helpers (path scaffolding, logging, …) — resolved against
    # the in-repo workspace member by [tool.uv.sources] below. Pulling
    # it in here means agents and other downstream consumers get the
    # utils transitively without restating the workspace pin.
    "headless-in-the-spire-utils",
]

[tool.uv.sources]
headless-in-the-spire-utils = { workspace = true }

[project.urls]
Homepage = "https://github.com/buckfae/headless-in-the-spire"

[tool.hatch.version]
path = "src/headless_in_the_spire/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/headless_in_the_spire"]

# Ruff and pyright are configured at the workspace root pyproject.toml so
# every Python member shares the same rules; no per-package overrides yet.

[tool.pytest.ini_options]
testpaths = ["tests"]
