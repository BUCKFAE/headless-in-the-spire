[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "headless-in-the-spire"
description = "Python client for the headless-in-the-spire runner (Slay the Spire 2)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Julian Schubert" }]
dynamic = ["version"]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "datamodel-code-generator[http]>=0.26",
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/julianschubert/headless-in-the-spire"

[tool.hatch.version]
path = "src/headless_in_the_spire/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/headless_in_the_spire"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
