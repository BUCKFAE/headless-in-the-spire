name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - ".github/badges/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sts2Headless.slnx

      - name: Build
        run: dotnet build Sts2Headless.slnx --configuration Release --no-restore

      # Only the unit suite runs in CI. Sts2Headless.IntegrationTests loads
      # vendor/sts2.dll, which is proprietary and cannot ship to CI — it stays
      # local. `just test-integration` runs it on dev machines after `just setup`.
      - name: Unit tests
        run: dotnet test tests/Sts2Headless.UnitTests/Sts2Headless.UnitTests.csproj --configuration Release --no-build --nologo --logger "console;verbosity=normal"

  update-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate badges
        run: bash scripts/badges/write-badges.sh

      - name: Commit badge changes
        run: |
          if [[ -z "$(git status --porcelain -- .github/badges)" ]]; then
            echo "Badges are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          git commit -m "Update generated badges"
          git push
