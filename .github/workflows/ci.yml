name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - ".github/badges/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single build job. Fetches vendor from the private mirror, runs
  # `just build::generate-content-ids` so every *Id.g.cs is sourced
  # from the pinned vendor/sts2.dll (no hand-curated Fallback drift),
  # then builds + tests the whole solution.
  #
  # Gated to trusted events only — fork PRs skip CI entirely because
  # secrets aren't exposed to them anyway. Acceptable tradeoff: the
  # repo gets ~zero fork PRs, and the Fallback-shortfall whack-a-mole
  # is not.
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      # Ubuntu 24.04's apt-shipped `just` (1.14) predates the `mod`
      # feature stabilising — the repo justfile won't parse. Pull the
      # latest release from GitHub.
      - uses: extractions/setup-just@v3

      - name: Fetch vendor from private mirror
        env:
          STS2_VENDOR_REPO: ${{ vars.STS2_VENDOR_REPO }}
          STS2_VENDOR_TOKEN: ${{ secrets.STS2_VENDOR_TOKEN }}
          STS2_VENDOR_PRIVKEY: ${{ secrets.STS2_VENDOR_PRIVKEY }}
          STS2_VENDOR_REF: ${{ vars.STS2_VENDOR_REF || 'main' }}
        run: bash scripts/setup/fetch-vendor-remote.sh

      - name: uv sync
        run: uv sync --all-packages

      # Generate *Id.g.cs (cards, relics, potions, …) from vendor/sts2.dll's
      # ModelDb. Without this, the solution build only sees CardId.Fallback —
      # a hand-curated subset that drifts every time BattleAgent code names
      # a new card. With this, the no-vendor build path is no longer
      # exercised in CI.
      - name: Generate content-ids + GodotStubs
        run: |
          just build::generate-content-ids
          just build::regen-godot-stubs

      - name: Build
        run: just build::build

      # AD-5 drift guard. Regenerates protocol/openrpc.json from the C#
      # records and fails if the checked-in artefact differs.
      - name: Schema drift check
        run: |
          dotnet run --project src/Sts2Headless.SchemaExport/Sts2Headless.SchemaExport.csproj --configuration Release --no-build
          git diff --exit-code protocol/openrpc.json

      # AD-5 drift guard for the Python DTOs. Same idea for _models.py.
      - name: Python models drift check
        run: |
          uv run python clients/python/headless-in-the-spire/scripts/generate_models.py
          git diff --exit-code clients/python/headless-in-the-spire/src/headless_in_the_spire/_models.py

      - name: Python lint
        run: |
          uv run ruff check clients/python/
          uv run ruff format --check clients/python/

      - name: Python typecheck
        run: uv run pyright

      # Full suite: C# unit + integration + e2e + Python tests. The
      # integration / e2e tests load vendor/sts2.dll, which is now
      # present.
      - name: Test
        env:
          XUNIT_THREADS: "2"
        run: just validation::test

      # Belt-and-suspenders against accidentally publishing vendor bytes
      # as an artifact. If a future step adds actions/upload-artifact,
      # this guard catches a stray vendor DLL outside vendor/ + bin/.
      - name: Artifact leak guard
        if: always()
        run: |
          set -euo pipefail
          stray=$(find . -type f \( -name 'sts2.dll' -o -name '0Harmony.dll' \) \
                    -not -path './vendor/*' \
                    -not -path '*/bin/*' \
                    -not -path '*/obj/*' \
                    -print)
          if [ -n "$stray" ]; then
            echo "::error::Vendor DLL found outside vendor/ — investigate before any artifact upload."
            echo "$stray"
            exit 1
          fi

  update-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate badges
        run: bash scripts/badges/write-badges.sh

      - name: Commit badge changes
        run: |
          if [[ -z "$(git status --porcelain -- .github/badges)" ]]; then
            echo "Badges are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          git commit -m "Update generated badges"
          git push
