name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - ".github/badges/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sts2Headless.slnx

      - name: Build
        run: dotnet build Sts2Headless.slnx --configuration Release --no-restore

      # AD-5 drift guard. Regenerates protocol/openrpc.json from the C#
      # records and fails if the checked-in artefact differs. Catches the
      # case where Methods.cs / MethodCatalog change without a paired
      # `just export-schema`. The meta-schema validation of the artefact
      # itself lives in OpenRpcSchemaTests under the unit suite.
      - name: Schema drift check
        run: |
          dotnet run --project src/Sts2Headless.SchemaExport/Sts2Headless.SchemaExport.csproj --configuration Release --no-build
          git diff --exit-code protocol/openrpc.json

      # Only the unit suite runs in CI. Sts2Headless.IntegrationTests loads
      # vendor/sts2.dll, which is proprietary and cannot ship to CI — it stays
      # local. `just test-integration` runs it on dev machines after `just setup`.
      - name: Unit tests
        run: dotnet test tests/Sts2Headless.UnitTests/Sts2Headless.UnitTests.csproj --configuration Release --no-build --nologo --logger "console;verbosity=normal"

      # ── Python client ───────────────────────────────────────────────────
      # uv manages Python itself (3.13 from .python-version) and every dev
      # tool. The workspace .venv at the repo root is created by `uv sync`
      # and serves every member.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: uv sync
        run: uv sync --all-packages

      - name: Python lint
        run: |
          uv run ruff check clients/python/
          uv run ruff format --check clients/python/

      - name: Python typecheck
        run: uv run pyright

      # AD-5 drift guard for the Python DTOs. Regenerates _models.py from
      # protocol/openrpc.json and fails if the checked-in file differs.
      # Mirrors the C# Schema-drift step above; catches a regen forgotten
      # after a Methods.cs change.
      - name: Python models drift check
        run: |
          uv run python clients/python/headless-in-the-spire/scripts/generate_models.py
          git diff --exit-code clients/python/headless-in-the-spire/src/headless_in_the_spire/_models.py

      # The live round-trip test in test_transport_smoke.py is gated on
      # vendor/sts2.dll being present (the host needs it to bootstrap, per
      # AD-3). CI has no vendor/, so those two cases skip automatically;
      # the parity tests still run. `clients/python/` picks up every
      # workspace member's tests.
      - name: Python tests
        run: uv run pytest clients/python/

  # Trusted tier — has access to the private vendor mirror via secrets, so
  # it can build + run the integration / e2e suites that load sts2.dll.
  # Only runs on events we trust:
  #   - push (only pushes from collaborators with write access reach here),
  #   - workflow_dispatch (manual trigger),
  #   - pull_request opened from a branch IN this repo (not a fork).
  # Fork PRs deliberately do NOT reach this job: secrets aren't exposed to
  # fork-PR runs anyway, but the explicit gate avoids the failed-fetch
  # noise and documents the security boundary.
  full-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Fetch vendor from private mirror
        env:
          STS2_VENDOR_REPO: ${{ vars.STS2_VENDOR_REPO }}
          STS2_VENDOR_TOKEN: ${{ secrets.STS2_VENDOR_TOKEN }}
          STS2_VENDOR_PRIVKEY: ${{ secrets.STS2_VENDOR_PRIVKEY }}
          STS2_VENDOR_REF: ${{ vars.STS2_VENDOR_REF || 'main' }}
        run: bash scripts/setup/fetch-vendor-remote.sh

      - name: uv sync
        run: uv sync --all-packages

      - name: Generate content-ids + GodotStubs from vendor
        run: |
          just build::generate-content-ids
          just build::regen-godot-stubs

      - name: Build
        run: just build::build

      - name: Test (full — C# integration + e2e + Python)
        env:
          XUNIT_THREADS: "2"
        run: just validation::test

      # Belt-and-suspenders against accidentally publishing vendor bytes
      # as an artifact. If a future step adds actions/upload-artifact,
      # this guard catches a stray vendor DLL in the upload root.
      - name: Artifact leak guard
        if: always()
        run: |
          set -euo pipefail
          stray=$(find . -type f \( -name 'sts2.dll' -o -name '0Harmony.dll' \) \
                    -not -path './vendor/*' \
                    -not -path '*/bin/*' \
                    -not -path '*/obj/*' \
                    -print)
          if [ -n "$stray" ]; then
            echo "::error::Vendor DLL found outside vendor/ — investigate before any artifact upload."
            echo "$stray"
            exit 1
          fi

  update-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate badges
        run: bash scripts/badges/write-badges.sh

      - name: Commit badge changes
        run: |
          if [[ -z "$(git status --porcelain -- .github/badges)" ]]; then
            echo "Badges are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          git commit -m "Update generated badges"
          git push
