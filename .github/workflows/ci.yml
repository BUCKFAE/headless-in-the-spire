name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - ".github/badges/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sts2Headless.slnx

      - name: Build
        run: dotnet build Sts2Headless.slnx --configuration Release --no-restore

      # AD-5 drift guard. Regenerates protocol/openrpc.json from the C#
      # records and fails if the checked-in artefact differs. Catches the
      # case where Methods.cs / MethodCatalog change without a paired
      # `just export-schema`. The meta-schema validation of the artefact
      # itself lives in OpenRpcSchemaTests under the unit suite.
      - name: Schema drift check
        run: |
          dotnet run --project src/Sts2Headless.SchemaExport/Sts2Headless.SchemaExport.csproj --configuration Release --no-build
          git diff --exit-code protocol/openrpc.json

      # Only the unit suite runs in CI. Sts2Headless.IntegrationTests loads
      # vendor/sts2.dll, which is proprietary and cannot ship to CI — it stays
      # local. `just test-integration` runs it on dev machines after `just setup`.
      - name: Unit tests
        run: dotnet test tests/Sts2Headless.UnitTests/Sts2Headless.UnitTests.csproj --configuration Release --no-build --nologo --logger "console;verbosity=normal"

      # ── Python client ───────────────────────────────────────────────────
      # uv manages Python itself (3.13 from .python-version) and every dev
      # tool. The workspace .venv at the repo root is created by `uv sync`
      # and serves every member.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: uv sync
        run: uv sync --all-packages

      - name: Python lint
        run: |
          uv run ruff check clients/python/
          uv run ruff format --check clients/python/

      - name: Python typecheck
        run: uv run pyright

      # AD-5 drift guard for the Python DTOs. Regenerates _models.py from
      # protocol/openrpc.json and fails if the checked-in file differs.
      # Mirrors the C# Schema-drift step above; catches a regen forgotten
      # after a Methods.cs change.
      - name: Python models drift check
        run: |
          uv run python clients/python/headless-in-the-spire/scripts/generate_models.py
          git diff --exit-code clients/python/headless-in-the-spire/src/headless_in_the_spire/_models.py

      # The live round-trip test in test_transport_smoke.py is gated on
      # vendor/sts2.dll being present (the host needs it to bootstrap, per
      # AD-3). CI has no vendor/, so those two cases skip automatically;
      # the parity tests still run. `clients/python/` picks up every
      # workspace member's tests.
      - name: Python tests
        run: uv run pytest clients/python/

  update-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate badges
        run: bash scripts/badges/write-badges.sh

      - name: Commit badge changes
        run: |
          if [[ -z "$(git status --porcelain -- .github/badges)" ]]; then
            echo "Badges are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          git commit -m "Update generated badges"
          git push
